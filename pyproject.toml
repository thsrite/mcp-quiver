[project]
name = "mcp-quiver"
version = "0.2.0"
description = "自建 MCP 服务集合（箭袋）"
requires-python = ">=3.10"
# 集合内各服务的依赖合并在一起，装一次全部可用。两个服务统一用 fastmcp v3。
dependencies = [
    "fastmcp>=3.4,<4",
    "python-docx",
    "lxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotcontent_mcp", "src/docx_comments_mcp"]

[project.scripts]
mcp-hotcontent = "hotcontent_mcp:main"
mcp-docx-comments = "docx_comments_mcp:main"
