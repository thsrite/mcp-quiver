[project]
name = "self-mcp"
version = "0.1.0"
description = "自建 MCP 服务集合"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotcontent_mcp"]

[project.scripts]
mcp-hotcontent = "hotcontent_mcp:main"
